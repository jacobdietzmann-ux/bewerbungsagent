[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explizit: sonst scheitert die Auto-Discovery an mehreren Top-Level-Paketen
# (bewerbungsagent + eval).
packages = ["bewerbungsagent", "bewerbungsagent.search", "eval"]

[project]
name = "bewerbungsagent"
version = "0.1.0"
description = "Agent zum Finden, Bewerten und Dokumentieren von Bewerbungen"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "requests>=2.28",
    "playwright>=1.44",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
# Semantisches Matching (Experiment, siehe ADR-015). CPU-only torch installieren:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
semantic = ["sentence-transformers>=3.0", "numpy>=1.24"]
# JobSpy-Provider (LinkedIn/Indeed/Google, siehe ADR-017). Zieht pandas/pydantic.
jobspy = ["python-jobspy>=1.3"]

[tool.pytest.ini_options]
# Package liegt im Repo-Root → Root auf den Importpfad legen.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Nur Regeln ignorieren, die auch ausgewählt sind. Deutsche Docstrings/Kommentare
# enthalten absichtlich Umlaute und typografische Zeichen (RUF001–003); die
# Zeilenlänge (E501) ist Stil, kein Bug.
ignore = [
    "E501", "RUF001", "RUF002", "RUF003",
]
