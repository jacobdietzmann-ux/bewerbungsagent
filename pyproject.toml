[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explizit: sonst scheitert die Auto-Discovery an mehreren Top-Level-Paketen
# (bewerbungsagent + eval).
packages = ["bewerbungsagent", "bewerbungsagent.search", "eval"]

[project]
name = "bewerbungsagent"
version = "0.1.0"
description = "Agent zum Finden, Bewerten und Dokumentieren von Bewerbungen"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "requests>=2.28",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
# Semantisches Matching (Experiment, siehe ADR-015). CPU-only torch installieren:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
semantic = ["sentence-transformers>=3.0", "numpy>=1.24"]
# JobSpy-Provider (LinkedIn/Indeed/Google, siehe ADR-017). Zieht pandas/pydantic.
jobspy = ["python-jobspy>=1.3"]

[tool.pytest.ini_options]
# Package liegt im Repo-Root → Root auf den Importpfad legen.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Bewusst ignoriert: defensive Exceptions (BLE001) und try/except/pass (S110)
# sind in einem Crawler/Importer gewollt; EXE001 (Shebang) ist irrelevant.
ignore = [
    "BLE001", "S110", "EXE001", "S606", "S101",
    # Deutsche Docstrings/Kommentare enthalten absichtlich Umlaute und
    # typografische Zeichen; Zeilenlänge ist Stil, kein Bug.
    "E501", "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
